# VRConfig Helper - build for Linux, Windows and macOS, and publish releases.
#
# When it runs (plain pushes and pull requests do NOT start it):
#   - a pushed tag that matches one of these; it builds all three systems and
#     publishes a GitHub Release:
#       v1.0.0, 1.0.0-release ........ release       Release + Debug builds
#       b1.0.0, 1.0.0-beta2 .......... pre-release   Release + Debug builds
#       t1.0.0, 1.0.0-test3 .......... pre-release   Debug build only (faster)
#     Any other tag is ignored.
#   - by hand: Actions tab > "release - multi platform" > Run workflow. Debug build
#     only; the zip is kept as a workflow artifact, nothing is published.
#
# The X-Plane SDK: each build job unpacks libs/XPSDK.zip into libs/xpsdk/ (step
# "Extract XPSDK") before CMake runs; CMake only expects libs/xpsdk/ to be there.
# Laminar's zip has had different top folder names (SDK, sdk, xpsdk-master); the
# step renames whichever it finds to xpsdk.
#
# The result of a tagged build, attached to the release:
#   vrconfig_helper-<tag>.zip          the plugin folder, ready to copy into
#                                      X-Plane/Resources/plugins/ (not for test builds)
#   vrconfig_helper-<tag>-debug.zip    the same folder with the Debug builds
#                                      (more detail in the log; for troubleshooting)
name: release - multi platform

on:
  push:
    tags:                     # only these tags; branch pushes never start the workflow
      - 'v*'
      - 'b*'
      - 't*'
      - '*-release*'
      - '*-beta*'
      - '*-test*'
  workflow_dispatch:          # Run workflow button (build only)

permissions:
  contents: read

env:
  PLUGIN_NAME: vrconfig_helper

jobs:
  # --- What kind of build is this? ---------------------------------------------------
  pre-build:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}               # release | beta | test | build
      prerelease: ${{ steps.kind.outputs.prerelease }}   # true | false
      version: ${{ steps.kind.outputs.version }}         # the project's VERSION in CMakeLists.txt
      build_types: ${{ steps.kind.outputs.build_types }} # JSON list for the build matrices
    steps:
      - uses: actions/checkout@v6

      - name: Work out the build kind from the tag
        id: kind
        shell: bash
        run: |
          kind="build"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if   [[ "$tag" == *-test* || "$tag" == t* ]];    then kind="test"
            elif [[ "$tag" == *-beta* || "$tag" == b* ]];    then kind="beta"
            elif [[ "$tag" == v* || "$tag" == *-release* ]]; then kind="release"
            fi
          fi
          prerelease="false"
          [[ "$kind" == "beta" || "$kind" == "test" ]] && prerelease="true"
          version=$(sed -n '/^project(vrconfig_helper/,/)/s/.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          build_types='["Release","Debug"]'
          [[ "$kind" == "test" || "$kind" == "build" ]] && build_types='["Debug"]'
          echo "build_types=$build_types" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Build kind: \`$kind\` (ref ${GITHUB_REF_NAME}, project version ${version})" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$kind" == "release" && "${GITHUB_REF_NAME#v}" != "$version"* ]]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} does not match the project VERSION ${version} in CMakeLists.txt"
          fi

  # --- Linux -------------------------------------------------------------------------
  # Built inside Ubuntu 22.04, so the plugin also loads on older distributions (it
  # needs glibc 2.35 or newer). GCC 13 comes from the Ubuntu toolchain PPA: 22.04's
  # own GCC 11 has no std::format. The C++ runtime is linked statically.
  build-lin:
    needs: [pre-build]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        #build_type: ${{ fromJSON(needs.pre-build.outputs.build_types) }}
        build_type: [Debug]
    steps:
      - name: Install the build tools
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common gpg-agent ca-certificates git
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends gcc-13 g++-13 make cmake libgl-dev file unzip

      - uses: actions/checkout@v6

      - name: Extract XPSDK
        shell: bash
        run: |
          cd libs
          rm -rf xpsdk SDK sdk xpsdk-master
          unzip -q -o XPSDK.zip
          if [ ! -d xpsdk ]; then
            if   [ -d SDK ];          then mv SDK xpsdk
            elif [ -d sdk ];          then mv sdk xpsdk
            elif [ -d xpsdk-master ]; then mv xpsdk-master xpsdk
            fi
          fi
          ls -l xpsdk
          test -f xpsdk/CHeaders/XPLM/XPLMDefs.h || { echo "::error::libs/XPSDK.zip: no CHeaders/XPLM/XPLMDefs.h under a known folder name"; exit 1; }

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          -DVRCH_DEPLOY=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Check the plugin file
        shell: bash
        run: |
          xpl="build/${PLUGIN_NAME}/lin_x64/${PLUGIN_NAME}.xpl"
          file "$xpl"
          echo "Needed libraries:"; objdump -p "$xpl" | grep NEEDED
          echo "Exported functions:"; objdump -T "$xpl" | grep -E " Xplugin|XPlugin" || true
          if objdump -p "$xpl" | grep -q "libstdc++"; then
            echo "::error::The Linux plugin must not need libstdc++.so (it is linked statically)"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-lin-${{ matrix.build_type }}
          path: build/${{ env.PLUGIN_NAME }}/
          if-no-files-found: error

  # --- Windows -----------------------------------------------------------------------
  # Visual Studio 2022 (MSVC), 64-bit; the C++ runtime is linked into the plugin (/MT).
  build-win:
    if: ( 1 == 2 )
    needs: [pre-build]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # build_type: ${{ fromJSON(needs.pre-build.outputs.build_types) }}
        build_type: [Debug]
    steps:
      - uses: actions/checkout@v6

      - name: Extract XPSDK
        shell: pwsh
        run: |
          cd libs
          Remove-Item -Recurse -Force xpsdk, SDK, sdk, xpsdk-master -ErrorAction SilentlyContinue
          Expand-Archive XPSDK.zip -DestinationPath . -Force
          if (-not (Test-Path xpsdk -PathType Container)) {
              if     (Test-Path SDK -PathType Container)          { Rename-Item SDK xpsdk }
              elseif (Test-Path xpsdk-master -PathType Container) { Rename-Item xpsdk-master xpsdk }
          }
          Get-ChildItem xpsdk
          if (-not (Test-Path xpsdk/Libraries/Win/XPLM_64.lib)) {
              Write-Host "::error::libs/XPSDK.zip: no Libraries/Win/XPLM_64.lib under a known folder name"; exit 1
          }

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DVRCH_DEPLOY=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Check the plugin file
        shell: bash
        run: ls -l "build/${PLUGIN_NAME}/win_x64/"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-win-${{ matrix.build_type }}
          path: |
            build/${{ env.PLUGIN_NAME }}/
            !build/${{ env.PLUGIN_NAME }}/win_x64/*.exp
            !build/${{ env.PLUGIN_NAME }}/win_x64/*.lib
            !build/${{ env.PLUGIN_NAME }}/win_x64/*.ilk
          if-no-files-found: error

  # --- macOS -------------------------------------------------------------------------
  # One plugin file for Apple Silicon and Intel (Universal 2), macOS 13.3 or newer.
  # Signed ad hoc (no Apple Developer account); see the install notes in README.md.
  build-mac:
    if: ( 1 == 2 )
    needs: [pre-build]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # build_type: ${{ fromJSON(needs.pre-build.outputs.build_types) }}
        build_type: [Debug]
    steps:
      - uses: actions/checkout@v6

      - name: Extract XPSDK
        shell: bash
        run: |
          cd libs
          rm -rf xpsdk SDK sdk xpsdk-master
          ditto -x -k XPSDK.zip .              # ditto keeps the framework symlinks
          if [ ! -d xpsdk ]; then
            if   [ -d SDK ];          then mv SDK xpsdk
            elif [ -d sdk ];          then mv sdk xpsdk
            elif [ -d xpsdk-master ]; then mv xpsdk-master xpsdk
            fi
          fi
          ls -l xpsdk xpsdk/Libraries/Mac/XPLM.framework
          test -d xpsdk/Libraries/Mac/XPLM.framework || { echo "::error::libs/XPSDK.zip: no Libraries/Mac/XPLM.framework under a known folder name"; exit 1; }

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVRCH_DEPLOY=OFF

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"

      - name: Check and sign the plugin file
        shell: bash
        run: |
          xpl="build/${PLUGIN_NAME}/mac_x64/${PLUGIN_NAME}.xpl"
          info=$(lipo -info "$xpl"); echo "$info"
          if [[ "$info" != *x86_64* || "$info" != *arm64* ]]; then
            echo "::error::Expected x86_64 and arm64 in one file, got: $info"; exit 1
          fi
          otool -L "$xpl"
          codesign --force --sign - "$xpl"
          codesign --verify --verbose "$xpl"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-mac-${{ matrix.build_type }}
          path: build/${{ env.PLUGIN_NAME }}/
          if-no-files-found: error

  # --- One plugin folder for all three systems -----------------------------------------
  package:
    needs: [pre-build, build-lin, build-win, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write                     # to create the GitHub Release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: download

      - name: Assemble the plugin folders and zip them
        id: zip
        shell: bash
        run: |
          set -e
          label="${GITHUB_REF_NAME//\//-}"
          files=""
          for type in Release Debug; do
            [[ -d "download/plugin-lin-${type}" ]] || continue        # only the types built
            out="dist/${type}/${PLUGIN_NAME}"
            mkdir -p "$out"
            for os in lin win mac; do
              cp -R "download/plugin-${os}-${type}/." "$out/"
            done
            # What a user reads first, and which build this is.
            cp LICENSE docs/VRConfig_Helper_User_Guide.txt "$out/"
            echo "${GITHUB_REF_NAME} ${type} (${GITHUB_SHA::8})" > "$out/build.txt"
            zip_name="${PLUGIN_NAME}-${label}.zip"
            [[ "$type" == "Debug" ]] && zip_name="${PLUGIN_NAME}-${label}-debug.zip"
            (cd "dist/${type}" && zip -r -9 "../../${zip_name}" "${PLUGIN_NAME}")
            files="${files}${zip_name}"$'\n'
          done
          find dist -type f | sort
          ls -l *.zip
          {
            echo "files<<EOF"
            printf '%s' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-all-platforms
          path: "*.zip"

      - name: Release notes
        if: needs.pre-build.outputs.kind != 'build'
        shell: bash
        run: |
          if [[ ! -f notes.md ]]; then
            echo "VRConfig Helper ${GITHUB_REF_NAME}" > notes.md
          fi

      - name: Publish the GitHub Release
        if: needs.pre-build.outputs.kind != 'build'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ needs.pre-build.outputs.kind }}: ${{ github.ref_name }}"
          body_path: notes.md
          prerelease: ${{ needs.pre-build.outputs.prerelease == 'true' }}
          files: ${{ steps.zip.outputs.files }}
