; =====================================================================================
;  DO NOT EDIT THIS FILE - it belongs to the plugin and is replaced by every update.
;
;  To use your own types: copy this file to "custom_manip_types.ini" in this same
;  folder (Resources/plugins/vrconfig_helper/) and edit the copy. When the custom file
;  exists the plugin reads it instead of this one (the whole file, nothing is merged).
;  After a plugin update, if the page says your copy is from an older version,
;  compare it with the new manip_types.ini and bring your copy up to date.
; =====================================================================================
;
; vrconfig_helper - manipulator types (Extract manipulators to vrconfig, VRConfig Manipulator Updater)
;
; One [section] per OBJ manipulator type (ATTR_manip_<type>). Comments start with ';'.
;   category = knob | switch | lever | yoke
;   label    = checkbox caption ({up_down} / {left_right} show an arrow)
;   params   = parameters before the tooltip (the cursor is 1)
;   refs     = which of them are the commands / datarefs (BEGIN_MANIP identity); their number
;              is also how many commands / datarefs a BEGIN_MANIP line of this type has
;   refs_are = commands | datarefs (default datarefs)
;   checked  = yes: ticked when the page opens
;   extract  = no: known (VRConfig Manipulator Updater, help) but not offered by Extract
;   line     = one line of the block written between BEGIN_MANIP and END_MANIP
;              (several 'line' entries = several lines; {deg} {name} {file} are replaced)
;   help     = the text of the type's (?) help marker; several 'help' lines = paragraphs
; [file]: version of this file's format and content - the plugin checks it.
; [defaults]: deg_per_action is {deg} when no deg_rule matches; a deg_rule lists words of the
;   tooltip / command name ('*' = starts with) and the degrees; the first match wins.
; [ignore]: types that are known but never read (not reported as unsupported).

[file]
version = 1

[defaults]
deg_per_action = 5
deg_rule = selector : 30
deg_rule = alt altitude* : 10

[command_knob]
category = knob
label    = cmd
params   = 3
refs     = 2 3
refs_are = commands
checked  = yes
line     = DEG_PER_ACTION {deg}
help     = Knob that runs a command for each step.
help     = BEGIN_MANIP command_knob <command clockwise> <command counter-clockwise>
help     = VR: turn the wrist. DEG_PER_ACTION = degrees of wrist rotation per command. ACTION axis_knob makes it change a dataref instead (smoother, finer).

[axis_knob]
category = knob
label    = axis
params   = 6
refs     = 6
checked  = yes
line     = DEG_PER_ACTION {deg}
help     = Knob that changes a dataref between a minimum and a maximum.
help     = BEGIN_MANIP axis_knob <dataref>
help     = VR: DEG_PER_ACTION = wrist rotation per step. WRAP_MANIP for course / heading knobs (not for lights or volume). ACTION axis_knob gives a new range or step - a negative step reverses the direction.

[command_knob2]
category = knob
label    = cmd2
params   = 2
refs     = 2
refs_are = commands
checked  = no
line     = DEG_PER_ACTION {deg}
help     = Knob with a single command.
help     = BEGIN_MANIP command_knob2 <command>
help     = VR: DEG_PER_ACTION = wrist rotation per command.

[drag_rotate]
category = knob
label    = rotate
params   = 16
refs     = 15 16
checked  = no
line     = DEG_PER_ACTION {deg}
help     = Knob or lever dragged around an axis, changing one or two datarefs.
help     = BEGIN_MANIP drag_rotate <dataref 1> <dataref 2>
help     = VR: DEG_PER_ACTION = wrist rotation per step.

[command_switch_up_down]
category = switch
label    = cmd {up_down}
params   = 3
refs     = 2 3
refs_are = commands
checked  = no
help     = Switch with one command for up and one for down.
help     = BEGIN_MANIP command_switch_up_down <command up> <command down>
help     = VR: flick the controller up or down; SWITCH_THRESHOLD sets how far. HOLD_MANIP = spring-loaded (the command is held while you hold it), e.g. starters. ACTION command_axis turns it into a push / pull control.

[command_switch_left_right]
category = switch
label    = cmd {left_right}
params   = 3
refs     = 2 3
refs_are = commands
checked  = no
help     = Switch with one command for right and one for left.
help     = BEGIN_MANIP command_switch_left_right <command right> <command left>
help     = VR: flick the controller sideways; SWITCH_THRESHOLD sets how far. HOLD_MANIP = spring-loaded. ACTION command_knob turns it into a knob (rotary selectors).

[command_switch_up_down2]
category = switch
label    = cmd2 {up_down}
params   = 2
refs     = 2
refs_are = commands
checked  = no
help     = Switch with one command that toggles it.
help     = BEGIN_MANIP command_switch_up_down2 <command>
help     = VR: INVERT_MANIP when it moves the wrong way.

[command_switch_left_right2]
category = switch
label    = cmd2 {left_right}
params   = 2
refs     = 2
refs_are = commands
checked  = no
help     = Sideways switch with one command that toggles it.
help     = BEGIN_MANIP command_switch_left_right2 <command>
help     = VR: INVERT_MANIP when it moves the wrong way.

[axis_switch_up_down]
category = switch
label    = axis {up_down}
params   = 6
refs     = 6
checked  = no
help     = Switch that steps a dataref up or down.
help     = BEGIN_MANIP axis_switch_up_down <dataref>
help     = VR: SWITCH_THRESHOLD sets how far to move. ACTION axis_switch_up_down gives a new range or step.

[axis_switch_left_right]
category = switch
label    = axis {left_right}
params   = 6
refs     = 6
checked  = no
help     = Sideways switch that steps a dataref.
help     = BEGIN_MANIP axis_switch_left_right <dataref>
help     = VR: SWITCH_THRESHOLD sets how far to move. ACTION axis_switch_left_right gives a new range or step.

[drag_axis]
category = lever
label    = drag axis
params   = 7
refs     = 7
checked  = no
line     = # TODO: VR settings for this manipulator
help     = Lever dragged along a line (throttle, flap handle, trim wheel), changing a dataref.
help     = BEGIN_MANIP drag_axis <dataref>
help     = VR: ACTION drag_axis sets the drag direction and range; ACTION axis_knob turns it into a knob with detents.

[drag_axis_pix]
category = lever
label    = drag pix
params   = 7
refs     = 7
checked  = no
line     = # TODO: VR settings for this manipulator
help     = Like drag_axis, but the OBJ measures the drag in screen pixels (knobs, trim wheels).
help     = BEGIN_MANIP drag_axis_pix <dataref>
help     = VR: usually works better converted: ACTION axis_knob, axis_switch_up_down / left_right or drag_axis.

[command_axis]
category = lever
label    = cmd axis
params   = 6
refs     = 5 6
refs_are = commands
checked  = no
line     = # TODO: VR settings for this manipulator
help     = Lever or push / pull control with a rest position between two commands.
help     = BEGIN_MANIP command_axis <command positive> <command negative>
help     = VR: HOLD_MANIP holds the command while you hold it (spring-loaded trim switch).

[drag_xy]
category = yoke
label    = drag xy
params   = 9
refs     = 8 9
checked  = no
line     = # TODO: VR settings for this manipulator
help     = Control dragged in two directions, e.g. the yoke or stick.
help     = BEGIN_MANIP drag_xy <x dataref> <y dataref> [tooltip] - for a yoke: roll ratio, pitch ratio. The tooltip tells the pilot's and copilot's yoke apart.
help     = VR (realistic yoke mode): YOKE_MANIP_ROTATE, YOKE_MANIP_TRANSLATE or JOYSTICK_MANIP.

[command]
category = switch
label    = button
params   = 2
refs     = 2
refs_are = commands
checked  = no
extract  = no
help     = Push button that runs a command.
help     = BEGIN_MANIP command <command>
help     = VR: ACTION command_switch_up_down2 makes it a toggle switch.

[push]
category = switch
label    = push
params   = 4
refs     = 4
checked  = no
extract  = no
help     = Button that sets a dataref while it is pressed.
help     = BEGIN_MANIP push <dataref>

[toggle]
category = switch
label    = toggle
params   = 4
refs     = 4
checked  = no
extract  = no
help     = Button or switch that toggles a dataref between two values.
help     = BEGIN_MANIP toggle <dataref>

[radio]
category = switch
label    = radio
params   = 3
refs     = 3
checked  = no
extract  = no
help     = Button that sets a dataref to one value (one of a group).
help     = BEGIN_MANIP radio <dataref>

[delta]
category = knob
label    = delta
params   = 6
refs     = 6
checked  = no
extract  = no
help     = Changes a dataref while held, within limits.
help     = BEGIN_MANIP delta <dataref>

[wrap]
category = knob
label    = wrap
params   = 6
refs     = 6
checked  = no
extract  = no
help     = Changes a dataref while held; the value wraps around.
help     = BEGIN_MANIP wrap <dataref>

[ignore]
types = device keyframe none noop wheel
