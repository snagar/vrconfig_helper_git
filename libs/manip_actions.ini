; =====================================================================================
;  DO NOT EDIT THIS FILE - it belongs to the plugin and is replaced by every update.
;
;  To use your own rules: copy this file to "custom_manip_actions.ini" in this same
;  folder (Resources/plugins/vrconfig_helper/) and edit the copy. When the custom file
;  exists the plugin reads it instead of this one (the whole file, nothing is merged).
;  After a plugin update, if the page says your copy is from an older version,
;  compare it with the new manip_actions.ini and bring your copy up to date.
; =====================================================================================
;
; vrconfig_helper - ACTION conversions and block settings for "VRConfig Manipulator Updater"
;
; [file]: version of this file's format and content - the plugin checks it.
; [action <name>]: ACTION <name> <params> - the manipulator works as another type in VR.
;   label     = shown in the ACTION list
;   from      = block types it is offered for (empty = every type)
;   confirmed = types Laminar's own aircraft convert this way (the others show "not confirmed")
;   version   = X-Plane version it needs (empty = any)
;   help      = help marker text; several 'help' lines = paragraphs
;   param     = name : number | dataref | command | text : default value : help (one per parameter)
;   prefill   = <OBJ type> : for each param, the OBJ parameter that fills it (1 = cursor, - = none)
;   reverse   = a param that gets a Reverse tick (flips its sign)
; [setting <KEYWORD>]: a block line KEYWORD <params>; without param lines it is a flag.
;   label = checkbox caption, for = types or categories (knob switch lever yoke; empty = every type),
;   group = only one setting of a group in a block; the group is one choice with this caption,
;   version / help / param / reverse as above.
; Every [setting] keyword (and ACTION) is a line that belongs inside a BEGIN_MANIP block.
; Comments start with ';'.

[file]
version = 1

[action axis_knob]
label     = Knob on a dataref (axis_knob)
from      = axis_knob command_knob command_knob2 drag_axis drag_axis_pix drag_rotate
confirmed = axis_knob command_knob
help      = In VR the manipulator becomes a knob that changes a dataref instead of running commands - finer and smoother. Turning the wrist by DEG_PER_ACTION degrees changes the dataref by one step.
param     = min : number : 0.0 : Lowest value the dataref is set to.
param     = max : number : 1.0 : Highest value the dataref is set to.
param     = step : number : 0.1 : Change of the dataref per step (a negative step reverses the direction).
param     = dataref : dataref :  : The dataref to change - usually the one the manipulator already uses.
prefill   = axis_knob : 2 3 4 6
prefill   = drag_axis : 5 6 - 7
prefill   = drag_axis_pix : 5 6 3 7
reverse   = step

[action axis_switch_up_down]
label     = Up / down switch on a dataref (axis_switch_up_down)
from      = axis_knob axis_switch_up_down command_switch_up_down drag_axis drag_axis_pix
confirmed = drag_axis
version   = 12
help      = In VR the manipulator becomes an up / down switch that steps a dataref. SWITCH_THRESHOLD sets how far the wrist or arm must move for one step.
param     = min : number : 0.0 : Lowest value the dataref is set to.
param     = max : number : 1.0 : Highest value the dataref is set to.
param     = step : number : 0.1 : Change of the dataref per step (a negative step reverses the direction).
param     = dataref : dataref :  : The dataref to change - usually the one the manipulator already uses.
prefill   = axis_switch_up_down : 2 3 4 6
prefill   = axis_knob : 2 3 4 6
prefill   = drag_axis : 5 6 - 7
prefill   = drag_axis_pix : 5 6 3 7
reverse   = step

[action axis_switch_left_right]
label     = Left / right switch on a dataref (axis_switch_left_right)
from      = axis_knob axis_switch_left_right command_switch_left_right drag_axis drag_axis_pix
confirmed = axis_knob command_switch_left_right
version   = 12
help      = Same as axis_switch_up_down, but moved sideways.
param     = min : number : 0.0 : Lowest value the dataref is set to.
param     = max : number : 1.0 : Highest value the dataref is set to.
param     = step : number : 0.1 : Change of the dataref per step (a negative step reverses the direction).
param     = dataref : dataref :  : The dataref to change - usually the one the manipulator already uses.
prefill   = axis_switch_left_right : 2 3 4 6
prefill   = axis_knob : 2 3 4 6
prefill   = drag_axis : 5 6 - 7
prefill   = drag_axis_pix : 5 6 3 7
reverse   = step

[action command_axis]
label     = Two commands with a rest position (command_axis)
from      = command_axis command_knob command_switch_left_right command_switch_up_down drag_axis
confirmed = command_switch_left_right command_switch_up_down
version   = 12
help      = In VR the manipulator becomes a control with a rest position between two commands, e.g. a spring-loaded trim switch or a push / pull knob. Usually together with HOLD_MANIP.
param     = dx : number : 0.0 : Movement along X (right) in meters that runs the first command.
param     = dy : number : 0.0 : Movement along Y (up) in meters.
param     = dz : number : 0.1 : Movement along Z (aft) in meters; negative = forward.
param     = command1 : command :  : Command for a movement in the direction of dx / dy / dz.
param     = command2 : command :  : Command for a movement in the opposite direction.
prefill   = command_switch_up_down : - - - 2 3
prefill   = command_switch_left_right : - - - 2 3
prefill   = command_axis : 2 3 4 5 6
prefill   = command_knob : - - - 2 3

[action command_knob]
label     = Knob with two commands (command_knob)
from      = axis_knob command_knob command_switch_left_right command_switch_up_down drag_axis drag_axis_pix
confirmed = axis_knob command_switch_left_right
version   = 12
help      = In VR the manipulator becomes a knob: turning one way runs the first command, the other way the second one. DEG_PER_ACTION sets the wrist rotation per command. Rotary selectors drawn as switches.
param     = command1 : command :  : Command for turning clockwise.
param     = command2 : command :  : Command for turning counter-clockwise.
prefill   = command_switch_left_right : 2 3
prefill   = command_switch_up_down : 2 3
prefill   = command_knob : 2 3

[action command_switch_up_down2]
label     = Toggle switch with one command (command_switch_up_down2)
from      = command command_switch_up_down2 toggle
confirmed = command
version   = 12
help      = In VR the manipulator becomes an up / down switch that runs one toggle command instead of two separate ones. INVERT_MANIP when it moves the wrong way.
param     = command : command :  : The toggle command.
prefill   = command : 2

[action command_switch_left_right2]
label     = Sideways toggle with one command (command_switch_left_right2)
from      = command command_switch_left_right2 toggle
confirmed = 
version   = 12
help      = Same as command_switch_up_down2, but moved sideways.
param     = command : command :  : The toggle command.
prefill   = command : 2

[action drag_axis]
label     = Lever on a dataref (drag_axis)
from      = drag_axis drag_axis_pix
confirmed = drag_axis drag_axis_pix
help      = In VR the manipulator becomes a lever dragged along a line that changes a dataref smoothly (trim wheels, levers). DISABLE_VISUALS hides the VR axis indicator.
param     = dx : number : 0.0 : Drag direction and length along X (right), in meters.
param     = dy : number : 0.0 : Along Y (up), in meters.
param     = dz : number : 0.0 : Along Z (aft), in meters.
param     = v1 : number : 0.0 : Dataref value at the start of the drag.
param     = v2 : number : 1.0 : Dataref value at the end of the drag.
param     = dataref : dataref :  : The dataref to change.
prefill   = drag_axis : 2 3 4 5 6 7
prefill   = drag_axis_pix : - - - 5 6 7

[action drag_xy]
label     = Grab like a yoke (drag_xy)
from      = 
confirmed = 
help      = In VR the manipulator behaves as if the user grabbed a yoke - commonly used to make a show / hide yoke work like the yoke itself.
param     = cursor : text : four_arrows : The cursor word; Laminar's example uses four_arrows.

[setting DEG_PER_ACTION]
label     = Degrees per action
for       = knob
help      = Wrist rotation needed before the knob acts once - like one mouse click.
param     = degrees : number : 5 : Degrees of wrist rotation per action. Small = fast (e.g. 2 for a brightness knob), large = slow (30 or more for selectors).

[setting SWITCH_THRESHOLD]
label     = Switch threshold
for       = knob lever switch
help      = How far the wrist must tilt, or the arm move, to flip the switch or move the dial one step. The arm movement lets the user lift or lower the arm instead of tilting the wrist.
param     = degrees : number : 20 : Wrist tilt in degrees.
param     = meters : number : 0.05 : Arm movement in meters.

[setting HOLD_MANIP]
label     = Hold / spring-loaded (HOLD_MANIP)
for       = command command_axis command_knob command_knob2 command_switch_left_right command_switch_left_right2 command_switch_up_down command_switch_up_down2
help      = The command is held as long as the control is held in position, instead of running once. For starter keys, spring-loaded switches and trim switches. Only for command manipulators, not dataref ones.

[setting WRAP_MANIP]
label     = Wraps around (WRAP_MANIP)
for       = knob
help      = The knob turns past its end to the other end - for course, heading and OBS knobs. Not for lights or volume.

[setting INVERT_MANIP]
label     = Reversed (INVERT_MANIP)
for       = knob lever switch
version   = 12
help      = Reverses the commands: for controls modelled or mounted backwards, without changing the OBJ.

[setting DISABLE_VISUALS]
label     = No VR feedback graphics (DISABLE_VISUALS)
for       = 
version   = 12
help      = Hides the interaction graphics, such as the axis indicator, while the control is used. The control itself is still drawn.

[setting YOKE_MANIP_ROTATE]
label     = Realistic yoke: rotating column or stick (YOKE_MANIP_ROTATE)
for       = drag_xy
group     = Realistic yoke
help      = For flight sticks and airliner column yokes: the control rotates forward / back and left / right around two centers (they may be the same point). Used when the user picks the realistic VR yoke mode. Flight stick: both centers at the floor pivot. Airliner: pitch center on the floor, roll center on the yoke. Not for very small side sticks - JOYSTICK_MANIP is better there.
param     = pitch_center_x : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = pitch_center_y : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = pitch_center_z : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = pitch_axis_x : number : 1.0 : Unit vector of the rotation, from the animation.
param     = pitch_axis_y : number : 0.0 : Unit vector of the rotation, from the animation.
param     = pitch_axis_z : number : 0.0 : Unit vector of the rotation, from the animation.
param     = pitch_min : number : -12.5 : Pitch travel, degrees, one way.
param     = pitch_max : number : 12.5 : Pitch travel, degrees, the other way.
param     = roll_center_x : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = roll_center_y : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = roll_center_z : number : 0.0 : Taken from the static translation before the animation (OBJ units, meters).
param     = roll_axis_x : number : 0.0 : Unit vector of the rotation, from the animation.
param     = roll_axis_y : number : 0.0 : Unit vector of the rotation, from the animation.
param     = roll_axis_z : number : -1.0 : Unit vector of the rotation, from the animation.
param     = roll_min : number : -60.0 : Roll travel, degrees, one way.
param     = roll_max : number : 60.0 : Roll travel, degrees, the other way.

[setting YOKE_MANIP_TRANSLATE]
label     = Realistic yoke: sliding yoke (YOKE_MANIP_TRANSLATE)
for       = drag_xy
group     = Realistic yoke
help      = For Cessna 172 style yokes: pitch slides the yoke in and out, roll turns it like a steering wheel. Used when the user picks the realistic VR yoke mode.
param     = pitch_min_x : number : 0.0 : One end of the pitch travel (OBJ units), from the translation animation.
param     = pitch_min_y : number : 0.0 : One end of the pitch travel.
param     = pitch_min_z : number : 0.0 : One end of the pitch travel - usually only Z differs.
param     = pitch_max_x : number : 0.0 : The other end of the pitch travel.
param     = pitch_max_y : number : 0.0 : The other end of the pitch travel.
param     = pitch_max_z : number : 0.08 : The other end; the distance between the ends is the travel from full nose up to full nose down.
param     = roll_center_x : number : 0.0 : Point the yoke turns around - usually its middle (static translation before the roll animation).
param     = roll_center_y : number : 0.0 : Point the yoke turns around.
param     = roll_center_z : number : 0.0 : Point the yoke turns around.
param     = roll_axis_x : number : 0.0 : Unit vector of the rotation, from the animation.
param     = roll_axis_y : number : 0.0 : Unit vector of the rotation, from the animation.
param     = roll_axis_z : number : -1.0 : Unit vector of the roll rotation - usually Z.
param     = roll_min : number : -45.0 : Roll travel, degrees, one way (end keyframe of the roll animation).
param     = roll_max : number : 45.0 : Roll travel, degrees, the other way.

[setting JOYSTICK_MANIP]
label     = Realistic yoke: side stick (JOYSTICK_MANIP)
for       = drag_xy
group     = Realistic yoke
help      = For side sticks and joysticks (Airbus, Cirrus Jet). The controller tilt between min and max covers the full range of the flight control. Used when the user picks the realistic VR yoke mode.
param     = pitch_min : number : -30.0 : Controller tilt for full nose down / up, degrees.
param     = pitch_max : number : 30.0 : Controller tilt for the other end, degrees.
param     = roll_min : number : -70.0 : Controller tilt for full roll one way, degrees.
param     = roll_max : number : 70.0 : Controller tilt for full roll the other way, degrees.
